# Optional local Postgres for development.
# If you already have Postgres running locally, you may not need this.

services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scoutx
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

